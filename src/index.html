<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>MCP Blockly Studio</title>
    <!-- Link a tu archivo CSS -->
</head>
<body>
    <div id="pageContainer">
        <div id="outputPane">
            <h1>MCP Blockly Studio</h1>
            <div class="controls"> <!-- Contenedor para controles -->
                <div class="project-selector">
                    <label for="projectSelect">Cargar proyecto:</label>
                    <select id="projectSelect">
                        <option value="empty">Nuevo proyecto (vacío)</option>
                        <option value="tutorial1">Proyecto 1: Eco</option>
                        <option value="tutorial2">Proyecto 2: Clima</option>
                        <option value="tutorial3">Proyecto 3: Tareas</option>
                        <option value="tutorial4">Proyecto 4: Imágenes</option>
                        <!-- <option value="tutorial5">Proyecto 5: Múltiples Nodos</option> -->
                    </select>
                </div>
                <button id="downloadCodeBtn">Descargar Código</button> <!-- Botón añadido -->
            </div>
            <div id="monacoContainer"></div> <!-- Monaco ocupará el espacio restante -->
            <!-- <div id="output"></div> Eliminado si ya no se usa -->
        </div>
        <div id="blocklyDiv"></div> <!-- Blockly ocupará esta columna -->
    </div>
    <!-- Scripts JS al final -->
    <script src="bundle.js"></script>
</body>
</html>
